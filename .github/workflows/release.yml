name: Release packages

# Builds .deb + .rpm on a real Linux runner, and a raw .exe + .msi
# installer on a real Windows runner, then (on a version tag push)
# attaches all four to a GitHub Release.
#
# NOTE: the Windows/MSI leg was authored without access to a Windows
# machine to test it (it was written and validated in a Linux-only
# sandbox — see the project README). One real bug has already been found
# and fixed from an actual CI run (see the comment on the "Build .msi"
# step below: `cargo wix build` isn't a valid command, cargo-wix has no
# "build" subcommand). If you hit another error, it means there's still
# something in this recipe that wasn't caught without real Windows CI
# access — send the log and it'll get fixed the same way.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Build .rpm
        run: bash packaging/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            pkg/deb/*.deb
            pkg/rpm/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Package portable .exe zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $dest = "server-sentinel-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item target/release/server-sentinel.exe $dest/
          Copy-Item -Recurse packaging/common $dest/config-sample
          Copy-Item README.md $dest/
          Compress-Archive -Path $dest -DestinationPath "$dest.zip"

      - name: Install WiX Toolset v3 (skipped if the runner already has one — windows-latest ships it preinstalled)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          } else {
            Write-Host "WiX Toolset already present on this runner, skipping install."
          }

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Generate WiX config (first run only)
        shell: pwsh
        run: |
          if (-not (Test-Path wix/main.wxs)) {
            cargo wix init --force
          }

      - name: Build .msi
        # NOTE: cargo-wix has no "build" subcommand — the bare `cargo wix`
        # command *is* the build step (init/clean/sign are the only real
        # subcommands). `cargo wix build` was an earlier mistake here: clap
        # silently treated the literal word "build" as the positional path
        # to a .wxs file, producing "Error[3] (Io): The 'build' path does
        # not exist" since no file/folder named `build` exists in the repo.
        run: cargo wix

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            server-sentinel-*-windows-x86_64.zip
            target/wix/*.msi

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-packages/**/*.deb
            dist/linux-packages/**/*.rpm
            dist/windows-packages/**/*.zip
            dist/windows-packages/**/*.msi
