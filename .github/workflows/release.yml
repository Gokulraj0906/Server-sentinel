name: Release packages

# Builds .deb + .rpm on a real Linux runner, and a raw .exe + .msi
# installer on a real Windows runner, then (on a version tag push)
# attaches all four to a GitHub Release.
#
# NOTE: the Windows/MSI leg was authored without access to a Windows
# machine to test it (it was written and validated in a Linux-only
# sandbox — see the project README). The recipe below (cargo-wix +
# WiX Toolset v3 via Chocolatey) is the standard, widely-used approach
# for Rust projects, but do a test run (push a `v0.0.0-test` tag, or
# trigger manually) before trusting it for a real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Build .rpm
        run: bash packaging/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            pkg/deb/*.deb
            pkg/rpm/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Package portable .exe zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $dest = "server-sentinel-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item target/release/server-sentinel.exe $dest/
          Copy-Item -Recurse packaging/common $dest/config-sample
          Copy-Item README.md $dest/
          Compress-Archive -Path $dest -DestinationPath "$dest.zip"

      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Generate WiX config (first run only)
        shell: pwsh
        run: |
          if (-not (Test-Path wix/main.wxs)) {
            cargo wix init
          }

      - name: Build .msi
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          cargo wix build --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            server-sentinel-*-windows-x86_64.zip
            target/wix/*.msi

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-packages/**/*.deb
            dist/linux-packages/**/*.rpm
            dist/windows-packages/**/*.zip
            dist/windows-packages/**/*.msi
