name: Release packages

# Builds .deb + .rpm on a real Linux runner, and a raw .exe + .msi
# installer on a real Windows runner, then (on a version tag push)
# attaches all four to a GitHub Release.
#
# NOTE: I don't have access to a Windows machine to test this directly —
# it was authored in a Linux-only sandbox (see the project README) and
# validated by watching real CI runs. Status as of the last run: both
# build-linux and build-windows succeeded, producing a real PE32+ .exe
# and a real WiX-built .msi (verified by inspecting the artifacts). Not
# yet confirmed: that the .msi actually double-click-installs cleanly on
# a real Windows machine — do that before cutting a real tagged release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Build .rpm
        run: bash packaging/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            pkg/deb/*.deb
            pkg/rpm/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Sign .exe (skipped until a certificate is configured)
        shell: pwsh
        # Fixes the "Unknown publisher" / SmartScreen warning on the .exe
        # — but only once WINDOWS_CERTIFICATE_BASE64 / _PASSWORD secrets
        # are set (Settings -> Secrets and variables -> Actions). Until
        # then this no-ops so the pipeline keeps working. Must run before
        # the .exe gets zipped up below. See README "Code signing".
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_BASE64) {
            Write-Host "No WINDOWS_CERTIFICATE_BASE64 secret configured — skipping signing. The .exe/.msi will still work but will show 'Unknown publisher' in Windows."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner image."; exit 1 }
          & $signtool sign /f $certPath /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/server-sentinel.exe
          Remove-Item $certPath -Force

      - name: Package portable .exe zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $dest = "server-sentinel-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item target/release/server-sentinel.exe $dest/
          # Only server-sentinel.toml applies on Windows — the rest of
          # packaging/common/ (postinst/prerm/postrm, the systemd unit)
          # is Linux-only packaging plumbing and doesn't belong here.
          Copy-Item packaging/common/server-sentinel.toml $dest/server-sentinel.toml
          Copy-Item README.md $dest/
          Compress-Archive -Path $dest -DestinationPath "$dest.zip"

      - name: Install WiX Toolset v3 (skipped if the runner already has one — windows-latest ships it preinstalled)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          } else {
            Write-Host "WiX Toolset already present on this runner, skipping install."
          }

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Generate WiX config (first run only)
        shell: pwsh
        run: |
          if (-not (Test-Path wix/main.wxs)) {
            cargo wix init --force
          }

      - name: Build .msi
        # NOTE: cargo-wix has no "build" subcommand — the bare `cargo wix`
        # command *is* the build step (init/clean/sign are the only real
        # subcommands). `cargo wix build` was an earlier mistake here: clap
        # silently treated the literal word "build" as the positional path
        # to a .wxs file, producing "Error[3] (Io): The 'build' path does
        # not exist" since no file/folder named `build` exists in the repo.
        run: cargo wix

      - name: Sign .msi (skipped until a certificate is configured)
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_BASE64) {
            Write-Host "No signing certificate configured — skipping .msi signing."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner image."; exit 1 }
          $msi = Get-ChildItem -Path target/wix -Filter "*.msi" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $certPath /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msi
          Remove-Item $certPath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            server-sentinel-*-windows-x86_64.zip
            target/wix/*.msi

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-packages/**/*.deb
            dist/linux-packages/**/*.rpm
            dist/windows-packages/**/*.zip
            dist/windows-packages/**/*.msi
